name: Node.js Unit Tests

on:
  pull_request:        # Trigger workflow when a PR is opened
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest   # GitHub provides a fresh Ubuntu VM

    steps:
    - name: Checkout code
      uses: actions/checkout@v3   # Pulls your repo code into the VM

    - name: Setup Node.js
      uses: actions/setup-node@v3 # Installs Node.js
      with:
        node-version: '18'        # Version of Node.js to use

    - name: Install dependencies
      run: npm install            # Installs packages from package.json

    - name: Run unit tests
      run: npm test               # Executes your Jest/Mocha tests
